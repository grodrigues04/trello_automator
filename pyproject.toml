[build-system]
requires = ['setuptools>=65.0', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
authors = [{ name = "Gustavo Bernardo Rodrigues" }]
name = "trello-automator"
description = "Implementa com o Claude as tasks da coluna GUSTAVO do Trello no ratUFSC"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
  "interface-personal-whats @ git+https://github.com/grodrigues04/interface-personal-whats.git@main",
  "python-dotenv >=1.0",
  "requests >=2.31",
]

[project.scripts]
trello-automator = "trello_automator.main:main"

[dependency-groups]
test = ["pytest", "pytest-mock"]
dev = [{ include-group = "test" }]

[tool.setuptools.dynamic]
version = { attr = "trello_automator.version.VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
